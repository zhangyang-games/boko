<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOKO · AI 读书老师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #1a1410;
  --ink2:    #5c4f3d;
  --ink3:    #9c8e7e;
  --paper:   #f5f0e8;
  --paper2:  #ede7d9;
  --paper3:  #e0d8c8;
  --accent:  #b85c2c;
  --accent2: #d4854a;
  --green:   #4a7c59;
  --border:  rgba(90,70,50,0.15);
  --shadow:  0 2px 16px rgba(60,40,20,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── 顶栏 ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--paper);
  position: sticky; top: 0; z-index: 100;
}
.logo {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 28px;
  letter-spacing: 0.08em;
  color: var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* ── 按钮 ── */
.btn {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--paper2);
  color: var(--ink2);
  transition: all .15s;
}
.btn:hover { background: var(--paper3); color: var(--ink); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: #a04e24; }
.btn-sm { font-size: 12px; padding: 5px 12px; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--paper2); }

/* ── 主布局 ── */
main {
  display: grid;
  grid-template-columns: 280px 1fr;
  flex: 1;
  min-height: 0;
}

/* ── 左侧书架 ── */
.sidebar {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow: hidden;
}
.sidebar-head {
  padding: 20px 20px 12px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.book-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 20px;
}
.book-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
  border-bottom: 1px solid var(--border);
}
.book-item:hover { background: var(--paper2); }
.book-item.active { background: var(--paper3); }
.book-thumb {
  width: 36px;
  height: 48px;
  border-radius: 3px;
  background: var(--accent2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #fff;
  font-family: 'DM Mono', monospace;
}
.book-thumb.epub { background: var(--green); }
.book-thumb.txt  { background: var(--ink3); }
.book-info { flex: 1; min-width: 0; }
.book-title { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book-meta { font-size: 11px; color: var(--ink3); font-family: 'DM Mono', monospace; }
.book-del {
  opacity: 0; font-size: 16px; color: var(--ink3);
  background: none; border: none; cursor: pointer;
  padding: 2px; transition: opacity .15s;
  flex-shrink: 0;
}
.book-item:hover .book-del { opacity: 1; }
.book-del:hover { color: #c0392b; }

/* 空状态 */
.empty-shelf {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 40px 20px; gap: 12px;
  color: var(--ink3); text-align: center;
}
.empty-shelf .empty-icon { font-size: 40px; opacity: 0.4; }
.empty-shelf p { font-size: 13px; line-height: 1.7; }

/* ── 上传区 ── */
.upload-area {
  margin: 0 10px 12px;
  border: 1.5px dashed var(--paper3);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent2);
  background: rgba(184,92,44,0.04);
}
.upload-area p { font-size: 12px; color: var(--ink3); margin-top: 4px; }
.upload-area .upload-icon { font-size: 22px; }

/* ── 右侧阅读区 ── */
.reader {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 欢迎屏 */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 60px 40px;
  text-align: center;
  color: var(--ink2);
}
.welcome-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 36px;
  color: var(--ink);
  letter-spacing: 0.05em;
}
.welcome-sub { font-size: 15px; line-height: 2; color: var(--ink3); max-width: 380px; }
.welcome-steps {
  display: flex; gap: 24px; margin-top: 8px;
}
.step {
  background: var(--paper2);
  border-radius: 12px;
  padding: 20px;
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
}
.step-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
}
.step p { font-size: 12px; color: var(--ink3); text-align: center; line-height: 1.6; }

/* 书籍阅读界面 */
.book-reader {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.book-reader-head {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
}
.book-reader-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.book-reader-sub { font-size: 12px; color: var(--ink3); margin-top: 2px; }

/* 章节选择器 */
.chunk-bar {
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  background: var(--paper2);
}
.chunk-btn {
  white-space: nowrap;
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  cursor: pointer;
  transition: all .15s;
  font-family: 'Noto Serif SC', serif;
}
.chunk-btn:hover { background: var(--paper3); }
.chunk-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* 对话区 */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 消息气泡 */
.msg {
  display: flex;
  gap: 12px;
  max-width: 760px;
}
.msg.user { flex-direction: row-reverse; align-self: flex-end; }
.msg-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--paper3);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.msg.user .msg-avatar { background: var(--accent); }
.msg-bubble {
  background: var(--paper2);
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px;
  padding: 14px 18px;
  font-size: 14px;
  line-height: 1.9;
  color: var(--ink);
  max-width: 620px;
}
.msg.user .msg-bubble {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  border-radius: 16px 16px 4px 16px;
}

/* 输入区 */
.chat-input-wrap {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--paper);
}
.chat-input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--paper2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  transition: border-color .15s;
}
.chat-input-row:focus-within { border-color: var(--accent2); }
.chat-input {
  flex: 1;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  background: none;
  border: none;
  outline: none;
  resize: none;
  color: var(--ink);
  max-height: 120px;
  line-height: 1.7;
}
.chat-input::placeholder { color: var(--ink3); }
.send-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 16px;
  flex-shrink: 0;
  transition: background .15s;
}
.send-btn:hover { background: #a04e24; }
.send-btn:disabled { background: var(--ink3); cursor: not-allowed; }

/* 快捷按钮 */
.quick-btns {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.quick-btn {
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink2);
  cursor: pointer;
  transition: all .15s;
  font-family: 'Noto Serif SC', serif;
}
.quick-btn:hover { background: var(--paper2); color: var(--accent); border-color: var(--accent2); }

/* loading */
.typing-dot {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 4px 0;
}
.typing-dot span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ink3);
  animation: bounce 1.2s infinite;
}
.typing-dot span:nth-child(2) { animation-delay: .2s; }
.typing-dot span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: .5; }
  40% { transform: translateY(-5px); opacity: 1; }
}

/* ── 配置弹窗 ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(20,15,10,.45);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 460px;
  max-width: 90vw;
  box-shadow: 0 8px 40px rgba(40,20,5,.18);
}
.modal h2 {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 6px;
}
.modal p { font-size: 13px; color: var(--ink3); margin-bottom: 20px; line-height: 1.7; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; color: var(--ink2); margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
.form-select, .form-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--paper2);
  color: var(--ink);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}
.form-select:focus, .form-input:focus { border-color: var(--accent2); }
.form-input[type="password"] { font-family: 'DM Mono', monospace; letter-spacing: 0.1em; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.provider-tag {
  display: inline-block;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--paper3);
  color: var(--accent);
  margin-top: 6px;
}

/* ── 响应式 ── */
@media (max-width: 700px) {
  main { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--paper3); border-radius: 2px; }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 10px 22px; border-radius: 30px;
  font-size: 13px; z-index: 999;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    BOKO
    <span style="font-size:13px;color:var(--ink3);font-family:'DM Mono',monospace;margin-left:6px">读书老师</span>
  </div>
  <div class="header-actions">
    <div id="cfg-badge" style="font-size:12px;color:var(--ink3);font-family:'DM Mono',monospace"></div>
    <button class="btn btn-sm" onclick="openConfig()">⚙ 配置</button>
    <button class="btn btn-sm btn-ghost" onclick="logout()" title="退出登录" style="color:var(--ink3)">退出</button>
  </div>
</header>

<main>
  <!-- 左侧书架 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span>我的书架</span>
      <span id="book-count" style="font-size:12px">0 本</span>
    </div>

    <!-- 上传区 -->
    <div class="upload-area" id="upload-area"
         onclick="document.getElementById('file-input').click()"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)">
      <div class="upload-icon">📚</div>
      <strong style="font-size:13px;color:var(--ink2)">点击或拖入书籍</strong>
      <p>支持 PDF · EPUB · TXT</p>
      <input type="file" id="file-input" accept=".pdf,.epub,.txt" style="display:none" onchange="handleFileSelect(event)">
    </div>

    <!-- 书单 -->
    <div class="book-list" id="book-list">
      <div class="empty-shelf">
        <div class="empty-icon">🌿</div>
        <p>书架还空着<br>上传第一本书开始学习吧</p>
      </div>
    </div>
  </aside>

  <!-- 右侧阅读区 -->
  <section class="reader" id="reader">
    <!-- 欢迎屏 -->
    <div class="welcome" id="welcome-screen">
      <div class="welcome-title">你好，我是 BOKO 📖</div>
      <div class="welcome-sub">
        我会把书里的内容用大白话讲给你听<br>
        你随时可以问我问题，我们一起聊书
      </div>
      <div class="welcome-steps">
        <div class="step">
          <div class="step-num">1</div>
          <p>上传一本 PDF 或 EPUB</p>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <p>选择想学的章节</p>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <p>让我用大白话讲给你听</p>
        </div>
      </div>
    </div>

    <!-- 书籍阅读界面（默认隐藏） -->
    <div class="book-reader" id="book-reader" style="display:none">
      <div class="book-reader-head">
        <div>
          <div class="book-reader-title" id="reader-title">书名</div>
          <div class="book-reader-sub" id="reader-sub">选择章节开始学习</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="newSession()" title="重新开始这一段">↺ 重新开始</button>
      </div>

      <!-- 章节选择器 -->
      <div class="chunk-bar" id="chunk-bar"></div>

      <!-- 聊天区 -->
      <div class="chat-area" id="chat-area"></div>

      <!-- 输入区 -->
      <div class="chat-input-wrap">
        <div class="quick-btns" id="quick-btns">
          <button class="quick-btn" onclick="sendQuick('再举个生活中的例子')">再举个例子</button>
          <button class="quick-btn" onclick="sendQuick('用更简单的话解释一下')">更简单一点</button>
          <button class="quick-btn" onclick="sendQuick('继续讲下去')">继续讲</button>
          <button class="quick-btn" onclick="sendQuick('这一段最重要的一句话是什么？')">一句话总结</button>
          <button class="quick-btn" onclick="showOriginalText()" style="border-color:var(--accent2);color:var(--accent)">📄 显示原文</button>
        </div>
        <div class="chat-input-row">
          <textarea class="chat-input" id="chat-input"
            placeholder="问我任何问题，或者说「继续讲」…"
            rows="1"
            onkeydown="handleKeydown(event)"
            oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 原文弹窗 -->
<div class="modal-overlay" id="orig-modal">
  <div class="modal" style="max-width:680px;max-height:80vh;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 id="orig-title">原文</h2>
      <button class="btn btn-sm btn-ghost" onclick="closeOrig()" style="font-size:18px">✕</button>
    </div>
    <div id="orig-content" style="overflow-y:auto;flex:1;font-size:14px;line-height:2;color:var(--ink2);white-space:pre-wrap;background:var(--paper2);border-radius:8px;padding:16px;border:1px solid var(--border)"></div>
    <div style="margin-top:16px;text-align:right">
      <button class="btn btn-sm" onclick="copyOrig()">复制全文</button>
      <button class="btn btn-sm btn-accent" onclick="closeOrig()" style="margin-left:8px">关闭</button>
    </div>
  </div>
</div>

<!-- 配置弹窗 -->
<div class="modal-overlay" id="config-modal">
  <div class="modal">
    <h2>AI 老师配置</h2>
    <p>填入你的 AI API 信息，BOKO 就能开始工作了。API Key 只存在你自己的服务器上。</p>
    <div class="form-group">
      <label class="form-label">AI 服务商</label>
      <select class="form-select" id="cfg-provider" onchange="updateProviderHint()">
        <option value="deepseek">DeepSeek（国产，便宜好用）</option>
        <option value="gemini">Google Gemini（有免费额度）</option>
        <option value="groq">Groq（免费，速度极快）</option>
        <option value="openrouter">OpenRouter（一个Key用多种模型）</option>
        <option value="claude">Claude / Anthropic</option>
        <option value="openai">OpenAI / GPT</option>
      </select>
      <div class="provider-tag" id="provider-hint">platform.deepseek.com</div>
    </div>
    <div class="form-group">
      <label class="form-label">API Key</label>
      <input type="password" class="form-input" id="cfg-key" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label class="form-label">模型（留空使用默认）</label>
      <input type="text" class="form-input" id="cfg-model" placeholder="留空自动选择最佳模型">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeConfig()">取消</button>
      <button class="btn btn-accent" onclick="saveConfig()">保存并测试</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 状态 ─────────────────────────────────────────────────────────
let books = []
let currentBook = null
let currentChunkIdx = 0
let sessionId = null
let isLoading = false

const PROVIDER_HINTS = {
  deepseek:   'platform.deepseek.com',
  gemini:     'aistudio.google.com/apikey',
  groq:       'console.groq.com',
  openrouter: 'openrouter.ai',
  claude:     'console.anthropic.com',
  openai:     'platform.openai.com',
}

// ── 初始化 ────────────────────────────────────────────────────────
async function init() {
  await loadBooks()
  await loadConfig()
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config')
    const cfg = await r.json()
    document.getElementById('cfg-badge').textContent =
      cfg.has_key ? `✦ ${cfg.provider} / ${cfg.model}` : '未配置 API'
    if (!cfg.has_key) setTimeout(openConfig, 800)
  } catch(e) {}
}

// ── 书籍 ─────────────────────────────────────────────────────────
async function loadBooks() {
  try {
    const r = await fetch('/api/books')
    books = await r.json()
    renderBookList()
  } catch(e) { showToast('加载书架失败') }
}

function renderBookList() {
  const el = document.getElementById('book-list')
  document.getElementById('book-count').textContent = `${books.length} 本`
  if (books.length === 0) {
    el.innerHTML = `<div class="empty-shelf"><div class="empty-icon">🌿</div><p>书架还空着<br>上传第一本书开始学习吧</p></div>`
    return
  }
  el.innerHTML = books.map(b => {
    const ext = b.filename.split('.').pop().toLowerCase()
    const icons = {pdf:'P', epub:'E', txt:'T'}
    const classes = {pdf:'', epub:'epub', txt:'txt'}
    return `<div class="book-item ${currentBook?.id===b.id?'active':''}" onclick="openBook('${b.id}')">
      <div class="book-thumb ${classes[ext]||''}">${icons[ext]||'📄'}</div>
      <div class="book-info">
        <div class="book-title">${b.title}</div>
        <div class="book-meta">${b.pages} 段 · ${formatTime(b.added_at)}</div>
      </div>
      <button class="book-del" onclick="deleteBook(event,'${b.id}')" title="删除">✕</button>
    </div>`
  }).join('')
}

async function openBook(bookId) {
  currentBook = books.find(b => b.id === bookId)
  if (!currentBook) return
  sessionId = null
  currentChunkIdx = 0

  document.getElementById('welcome-screen').style.display = 'none'
  document.getElementById('book-reader').style.display = 'flex'
  document.getElementById('reader-title').textContent = currentBook.title
  document.getElementById('reader-sub').textContent = `${currentBook.pages} 个章节`
  document.getElementById('chat-area').innerHTML = ''

  renderBookList()
  await loadChunks()
}

async function loadChunks() {
  try {
    const r = await fetch(`/api/books/${currentBook.id}/chunks`)
    const chunks = await r.json()
    const bar = document.getElementById('chunk-bar')
    bar.innerHTML = chunks.map(c =>
      `<button class="chunk-btn ${c.idx===currentChunkIdx?'active':''}"
               onclick="selectChunk(${c.idx})">${c.title}</button>`
    ).join('')
    // 自动开始讲第一段
    await startChunk(currentChunkIdx)
  } catch(e) { showToast('加载章节失败') }
}

async function selectChunk(idx) {
  currentChunkIdx = idx
  sessionId = null
  document.querySelectorAll('.chunk-btn').forEach((b,i) => b.classList.toggle('active', i===idx))
  document.getElementById('chat-area').innerHTML = ''
  await startChunk(idx)
}

async function startChunk(idx) {
  await sendToApi(null)  // 传 null 表示"开始讲"
}

function newSession() {
  sessionId = null
  document.getElementById('chat-area').innerHTML = ''
  startChunk(currentChunkIdx)
}

// ── 聊天 ─────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text || isLoading) return
  input.value = ''
  autoResize(input)
  appendMsg('user', text)
  await sendToApi(text)
}

async function sendQuick(text) {
  if (isLoading) return
  appendMsg('user', text)
  await sendToApi(text)
}

async function sendToApi(userMsg) {
  if (!currentBook) return
  setLoading(true)
  const loadingEl = appendLoading()
  try {
    const body = {
      session_id:  sessionId,
      book_id:     currentBook.id,
      chunk_idx:   currentChunkIdx,
      message:     userMsg,
    }
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    })
    if (!r.ok) {
      const err = await r.json()
      throw new Error(err.detail || '请求失败')
    }
    const data = await r.json()
    sessionId = data.session_id
    loadingEl.remove()
    appendMsg('boko', data.reply)
  } catch(e) {
    loadingEl.remove()
    appendMsg('boko', `😥 出错了：${e.message}`)
  } finally {
    setLoading(false)
  }
}

function appendMsg(role, text) {
  const area = document.getElementById('chat-area')
  const isUser = role === 'user'
  const div = document.createElement('div')
  div.className = `msg ${isUser ? 'user' : ''}`
  div.innerHTML = `
    <div class="msg-avatar">${isUser ? '你' : '🐦'}</div>
    <div class="msg-bubble">${escHtml(text).replace(/\n/g,'<br>')}</div>
  `
  area.appendChild(div)
  area.scrollTop = area.scrollHeight
  return div
}

function appendLoading() {
  const area = document.getElementById('chat-area')
  const div = document.createElement('div')
  div.className = 'msg'
  div.innerHTML = `
    <div class="msg-avatar">🐦</div>
    <div class="msg-bubble"><div class="typing-dot"><span></span><span></span><span></span></div></div>
  `
  area.appendChild(div)
  area.scrollTop = area.scrollHeight
  return div
}

function setLoading(v) {
  isLoading = v
  document.getElementById('send-btn').disabled = v
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage()
  }
}

function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 120) + 'px'
}

// ── 上传 ─────────────────────────────────────────────────────────
function handleDragOver(e) { e.preventDefault(); document.getElementById('upload-area').classList.add('dragover') }
function handleDragLeave(e) { document.getElementById('upload-area').classList.remove('dragover') }
function handleDrop(e) {
  e.preventDefault()
  document.getElementById('upload-area').classList.remove('dragover')
  const file = e.dataTransfer.files[0]
  if (file) uploadFile(file)
}
function handleFileSelect(e) { if (e.target.files[0]) uploadFile(e.target.files[0]) }

async function uploadFile(file) {
  const area = document.getElementById('upload-area')
  area.innerHTML = `<div class="upload-icon">⏳</div><strong style="font-size:13px">正在解析书籍…</strong><p>${file.name}</p>`
  try {
    const fd = new FormData()
    fd.append('file', file)
    const r = await fetch('/api/books/upload', {method:'POST', body:fd})
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail) }
    const data = await r.json()
    await loadBooks()
    showToast(`《${data.title}》上传成功，共 ${data.chunks} 段`)
    openBook(data.id)
  } catch(e) {
    showToast(`上传失败：${e.message}`)
  } finally {
    area.innerHTML = `<div class="upload-icon">📚</div><strong style="font-size:13px;color:var(--ink2)">点击或拖入书籍</strong><p>支持 PDF · EPUB · TXT</p><input type="file" id="file-input" accept=".pdf,.epub,.txt" style="display:none" onchange="handleFileSelect(event)">`
  }
}

async function deleteBook(e, bookId) {
  e.stopPropagation()
  if (!confirm('确定删除这本书？')) return
  try {
    await fetch(`/api/books/${bookId}`, {method:'DELETE'})
    if (currentBook?.id === bookId) {
      currentBook = null
      document.getElementById('welcome-screen').style.display = 'flex'
      document.getElementById('book-reader').style.display = 'none'
    }
    await loadBooks()
    showToast('已删除')
  } catch(e) { showToast('删除失败') }
}

// ── 配置 ─────────────────────────────────────────────────────────
function openConfig() { document.getElementById('config-modal').classList.add('open') }
function closeConfig() { document.getElementById('config-modal').classList.remove('open') }

function updateProviderHint() {
  const p = document.getElementById('cfg-provider').value
  document.getElementById('provider-hint').textContent = PROVIDER_HINTS[p] || ''
}

async function saveConfig() {
  const provider = document.getElementById('cfg-provider').value
  const key = document.getElementById('cfg-key').value.trim()
  const model = document.getElementById('cfg-model').value.trim()

  if (!key) { showToast('请填写 API Key'); return }

  // 通过环境变量传入的 key 不能在前端改，这里仅做提示
  // 实际配置在服务器端，这里只是引导用户
  showToast('配置已保存到服务器环境变量中（重启生效）')
  closeConfig()

  // 告知后端（如果有运行时配置接口）
  try {
    await fetch('/api/config/set', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({provider, api_key: key, model})
    })
    await loadConfig()
  } catch(e) {}
}

// ── 工具 ─────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
function formatTime(ts) {
  const d = new Date(ts * 1000)
  return `${d.getMonth()+1}/${d.getDate()}`
}
function showToast(msg, duration=2500) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), duration)
}

// ── 原文显示 ─────────────────────────────────────────────────────────
async function showOriginalText() {
  if (!currentBook) return
  document.getElementById('orig-content').textContent = '加载中…'
  document.getElementById('orig-title').textContent = '原文加载中'
  document.getElementById('orig-modal').classList.add('open')
  try {
    const r = await fetch(`/api/books/${currentBook.id}/chunks/${currentChunkIdx}/content`)
    if (!r.ok) throw new Error('请求失败')
    const data = await r.json()
    document.getElementById('orig-title').textContent = `原文 · ${data.title}`
    document.getElementById('orig-content').textContent = data.content
  } catch(e) {
    document.getElementById('orig-content').textContent = '加载失败：' + e.message
  }
}
function closeOrig() { document.getElementById('orig-modal').classList.remove('open') }
function copyOrig() {
  const text = document.getElementById('orig-content').textContent
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败，请手动选择'))
}

// 点击弹窗外关闭
document.getElementById('orig-modal').addEventListener('click', function(e) {
  if (e.target === this) closeOrig()
})
document.getElementById('config-modal').addEventListener('click', function(e) {
  if (e.target === this) closeConfig()
})

init()
</script>
</body>
